# Fly.io deployment config for LUDO backend
# Docs: https://fly.io/docs/reference/configuration/

app = "ludo-game-server"
primary_region = "sin"        # Singapore — closest to India

[build]
  # Fly auto-detects Node.js — no Dockerfile needed

[env]
  NODE_ENV = "production"
  PORT     = "8080"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false   # NEVER sleep — always on!
  auto_start_machines = true
  min_machines_running = 1      # Keep at least 1 machine running

[[vm]]
  size   = "shared-cpu-1x"     # Free tier machine
  memory = "256mb"
