# Render Blueprint — Deploys both backend and frontend automatically
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── 1. Node.js Backend (Web Service) ─────────────────────────────────────
  - type: web
    name: ludo-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        # Set this AFTER the static site is deployed
        # e.g. https://ludo-client.onrender.com
        sync: false

  # ── 2. React Frontend (Static Site) ──────────────────────────────────────
  - type: web
    name: ludo-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        # Set this to your ludo-server URL after it deploys
        # e.g. https://ludo-server.onrender.com
        sync: false
    routes:
      # React Router — send all routes to index.html (SPA fallback)
      - type: rewrite
        source: /*
        destination: /index.html
